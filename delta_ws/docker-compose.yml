services:
  # ---- Development: mount source, build inside the container ----
  dev:
    build:
      context: .
      target: dev
    image: my-ros2-dev:latest
    network_mode: host
    ipc: host
    stdin_open: true          # -i
    tty: true                 # -t
    volumes:
      - ./src:/ws/src                 # your code: edit on the host, build in the container
      - ros-build:/ws/build           # build artifacts persist between runs
      - ros-install:/ws/install
      - ros-log:/ws/log
    devices:
      - /dev/i2c-1
      # - /dev/gpiochip4
      # - /dev/ttyUSB0
    environment:
      - ROS_DOMAIN_ID=7
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - ROS_AUTOMATIC_DISCOVERY_RANGE=SUBNET
    command: bash

  # ---- Deployment: self-contained image with compiled code baked in ----
  app:
    profiles: [prod]
    build:
      context: .
      target: runtime
    image: my-ros2-app:latest
    network_mode: host
    ipc: host
    devices:
      - /dev/i2c-1
    environment:
      - ROS_DOMAIN_ID=7
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - ROS_AUTOMATIC_DISCOVERY_RANGE=SUBNET
    command: ros2 launch python_utils abc.launch.py
    restart: unless-stopped

volumes:
  ros-build:
  ros-install:
  ros-log: