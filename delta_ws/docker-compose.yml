services:
  ros:
    build:
      context: .
      platforms: [linux/arm64]
    image: my-ros2-app:latest
    volumes: # mount workspace?
      - ./src/python_i2c_scanner/python_i2c_scanner:/ws/install/python_i2c_scanner/lib/python3.12/site-packages/python_i2c_scanner
    network_mode: host        # DDS discovery
    ipc: host
    devices:
      - /dev/i2c-1:/dev/i2c-1
    #   - /dev/gpiochip4      # Pi 5 header GPIO (RP1)
    #   - /dev/ttyUSB0
    #   - /dev/video0
    command: ros2 launch python_i2c_scanner abc.launch.py
    restart: unless-stopped