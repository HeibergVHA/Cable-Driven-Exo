services:
  ros:
    build:
      context: .
      platforms: [linux/arm64]
    image: my-ros2-app:latest
    volumes:
      - ./src/python_package2343/python_package2343:/ws/install/python_package2343/lib/python3.12/site-packages/python_package2343
    network_mode: host        # simplest way to get DDS discovery working
    ipc: host
    #privileged: true          # or replace with specific devices below
    devices:
      - /dev/i2c-1:/dev/i2c-1
    #   - /dev/gpiochip4      # Pi 5 header GPIO (RP1)
    #   - /dev/ttyUSB0
    #   - /dev/video0
    command: ros2 launch python_package2343 abc.launch.py
    restart: unless-stopped